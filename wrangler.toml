# Cloudflare Workers：静态资源 + /api 入口 + 对战房间 Durable Object。
# 资源目录为 Vite 生产构建产物 dist/。
# not_found_handling 使 /games/:slug 等深链回退到 index.html。
# run_worker_first 仅拦截 /api/*（含 WebSocket），其余路径仍走静态资源与 SPA 回退。
# Worker 名称必须保持 mini-arcade；本文件不包含账号凭据，不添加付费计划。
name = "mini-arcade"
main = "worker/index.ts"
compatibility_date = "2026-11-10"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true

[[durable_objects.bindings]]
name = "TETRIS_VS_ROOMS"
class_name = "TetrisVsRoom"

[[durable_objects.bindings]]
name = "GOMOKU_VS_ROOMS"
class_name = "GomokuVsRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "TetrisVsRoom" ]

[[migrations]]
tag = "v2"
new_sqlite_classes = [ "GomokuVsRoom" ]
