# Cloudflare Workers Static Assets（SPA）配置。
# 资源目录为 Vite 生产构建产物 dist/。
# not_found_handling 使 /games/:slug 等深链回退到 index.html。
# 本文件不包含账号凭据；部署使用已连接的 Cloudflare 账户，不添加付费计划。
name = "mini-arcade"
compatibility_date = "2026-11-10"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true
